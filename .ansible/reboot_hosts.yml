- name: Reboot hosts if required
  hosts: all:!hub.wax.su
  become: true
  serial: 1                     # one host at a time
  tasks:
    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Show packages requiring reboot
      ansible.builtin.command: cat /var/run/reboot-required.pkgs
      register: reboot_pkgs
      changed_when: false
      failed_when: false
      when: reboot_required.stat.exists

    - name: Packages
      ansible.builtin.debug:
        var: reboot_pkgs.stdout_lines
      when: reboot_required.stat.exists

    - name: Reboot
      ansible.builtin.reboot:
        msg: "Reboot by Ansible after updates"
        reboot_timeout: 600
        post_reboot_delay: 15
      when: reboot_required.stat.exists or force_reboot | default(false) | bool

    - name: Wait for host to be reachable
      ansible.builtin.wait_for_connection:
        timeout: 300
