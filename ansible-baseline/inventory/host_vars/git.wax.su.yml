---
# GitLab + WireGuard на git.wax.su
baseline_ufw_rules:
  - { port: "80", proto: tcp }
  - { port: "443", proto: tcp }
  - { port: "1443", proto: udp }

# Хост маршрутизирует трафик WireGuard — форвардинг нужен
baseline_ip_forward: true

baseline_ufw_route_rules:
  - interface_in: wg8
    src: any
    dest: any
