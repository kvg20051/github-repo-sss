---
# ---------- Общие настройки для всех хостов ----------

baseline_timezone: Europe/Moscow

# Администраторы: создаются на всех хостах, получают sudo и SSH-ключи.
# Ключи берутся с управляющей машины (mail). Добавьте свои при необходимости.
baseline_admins:
  - name: kvg
    shell: /bin/bash
    ssh_keys:
      - "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
    sudo_nopasswd: true

# Доверенные IP/сети: весь входящий трафик на любые порты и по всем протоколам.
# Один список на все хосты; имя переменной сохранено для совместимости.
baseline_ssh_allowed:
  - 46.8.181.72    #
  - 46.8.181.70    #
  - 46.8.181.71    #
  - 46.8.181.42    #
  - 46.8.180.83    #
  - 132.243.22.149 #
  - 46.166.168.18  #
  - 85.30.248.159  #
  - 185.9.77.170   # 
  - 95.31.179.122
  - 79.98.30.0/24
  - 188.92.178.0/24
  - 194.186.246.0/24
  - 195.239.14.0/24
  - 10.125.125.0/24
  - 10.124.124.0/24
  - 10.123.123.0/24
  - 10.66.66.0/24
  - 10.5.5.0/24
  - 10.6.6.0/24

# Дополнительные правила ufw для конкретного хоста задаются в host_vars:
# baseline_ufw_rules:
#   - { port: "80", proto: tcp }
baseline_ufw_rules: []

# Пакеты, которые автообновления НЕ трогают (обновляются вручную)
baseline_unattended_blacklist:
  - gitlab-ce
  - gitlab-ee
  - ansible
  - ansible-core
