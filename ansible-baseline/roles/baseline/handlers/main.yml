---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Apply sysctl
  ansible.builtin.command: /usr/lib/systemd/systemd-sysctl /etc/sysctl.d/90-baseline.conf
  changed_when: true

- name: Restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted
