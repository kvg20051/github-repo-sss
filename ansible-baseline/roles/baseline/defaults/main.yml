---
baseline_timezone: Etc/UTC

baseline_packages:
  - ca-certificates
  - curl
  - wget
  - vim
  - htop
  - tmux
  - git
  - jq
  - rsync
  - unzip
  - dnsutils
  - net-tools
  - lsof
  - ncdu
  - bash-completion
  - chrony
  - ufw
  - fail2ban
  - unattended-upgrades
  - apt-transport-https

baseline_admins: []
baseline_user_generate_ssh_key: true
baseline_user_configure_ssh_client: true
baseline_user_configure_bash: true

# --- SSH ---
baseline_ssh_port: 22
baseline_ssh_permit_root_login: "no"
baseline_ssh_password_auth: "no"
baseline_ssh_max_auth_tries: 3

# --- UFW ---
baseline_ssh_allowed: []
baseline_ufw_rules: []
baseline_ufw_enable: true

# --- fail2ban ---
baseline_fail2ban_bantime: 1h
baseline_fail2ban_findtime: 10m
baseline_fail2ban_maxretry: 5
# IP/сети, которые fail2ban никогда не банит
baseline_fail2ban_ignoreip: "{{ ['127.0.0.1/8', '::1'] + baseline_ssh_allowed }}"

# --- unattended-upgrades ---
baseline_unattended_blacklist: []
baseline_unattended_auto_reboot: false

# --- journald ---
baseline_journald_max_use: 500M
