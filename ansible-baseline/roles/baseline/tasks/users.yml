---
- name: Create admin users
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    groups: sudo
    append: true
    state: present
  loop: "{{ baseline_admins }}"
  loop_control:
    label: "{{ item.name }}"

- name: Authorized SSH keys for admins
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
    state: present
  loop: "{{ baseline_admins | subelements('ssh_keys') }}"
  loop_control:
    label: "{{ item.0.name }}"

- name: Passwordless sudo for admins (where enabled)
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ item.name }}"
    content: "{{ item.name }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
    mode: "0440"
    owner: root
    group: root
    validate: /usr/sbin/visudo -cf %s
  loop: "{{ baseline_admins | selectattr('sudo_nopasswd', 'defined') | selectattr('sudo_nopasswd') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove managed passwordless sudo when disabled
  ansible.builtin.file:
    path: "/etc/sudoers.d/90-{{ item.name }}"
    state: absent
  loop: "{{ baseline_admins }}"
  when: not (item.sudo_nopasswd | default(false) | bool)
  loop_control:
    label: "{{ item.name }}"

- name: Validate the complete sudo configuration
  ansible.builtin.command: /usr/sbin/visudo -c
  changed_when: false
  when: not ansible_check_mode
