---
- name: Resolve SSH probe settings on the target host
  ansible.builtin.set_fact:
    baseline_ssh_target:
      host: "{{ ansible_host | default(inventory_hostname) }}"
      user: "{{ ansible_user | default('') }}"
      port: "{{ ansible_port | default(ansible_ssh_port | default(22)) }}"
      key: "{{ ansible_private_key_file | default(ansible_ssh_private_key_file | default('')) }}"
      common_args: "{{ ansible_ssh_common_args | default('') }}"
      extra_args: "{{ ansible_ssh_extra_args | default('') }}"
      executable: "{{ ansible_ssh_executable | default('ssh') }}"

- name: Require a usable administrator and an unchanged SSH port
  ansible.builtin.assert:
    that:
      - baseline_ssh_target.user | length > 0
      - baseline_ssh_target.user != 'root' or baseline_ssh_permit_root_login != 'no'
      - baseline_ssh_target.port | int == baseline_ssh_port | int
    fail_msg: >-
      Set ansible_user to the administrator that will retain SSH access.
      Run this role as that user. SSH port migrations require a separate procedure.

- name: Prove key login before changing authentication
  ansible.builtin.include_tasks: ssh_probe.yml

- name: Create a private SSH validation directory
  ansible.builtin.tempfile:
    state: directory
    prefix: baseline-ssh-
  register: baseline_ssh_stage
  check_mode: false
  changed_when: false

- name: Prepare and install validated SSH configuration
  block:
    - name: Render the candidate without replacing the live configuration
      ansible.builtin.template:
        src: sshd_baseline.conf.j2
        dest: "{{ baseline_ssh_stage.path }}/candidate.conf"
        owner: root
        group: root
        mode: "0600"
      check_mode: false
      changed_when: false
      diff: false

    - name: Stage the full-configuration validator
      ansible.builtin.copy:
        src: validate_sshd.py
        dest: "{{ baseline_ssh_stage.path }}/validate_sshd.py"
        owner: root
        group: root
        mode: "0600"
      check_mode: false
      changed_when: false

    - name: Validate the candidate and effective global authentication settings
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ baseline_ssh_stage.path }}/validate_sshd.py"
          - "--candidate={{ baseline_ssh_stage.path }}/candidate.conf"
          - "--password-auth={{ baseline_ssh_password_auth }}"
          - "--root-login={{ baseline_ssh_permit_root_login }}"
      check_mode: false
      changed_when: false

    - name: Install and verify the SSH configuration with rollback
      block:
        - name: Install the validated drop-in and preserve its previous version
          ansible.builtin.copy:
            src: "{{ baseline_ssh_stage.path }}/candidate.conf"
            remote_src: true
            dest: /etc/ssh/sshd_config.d/10-baseline.conf
            owner: root
            group: root
            mode: "0644"
            backup: true
          register: baseline_ssh_install

        - name: Validate the installed full configuration on every real run
          ansible.builtin.command: /usr/sbin/sshd -t
          changed_when: false
          when: not ansible_check_mode

        - name: Reload SSH immediately after a validated change
          ansible.builtin.service:
            name: ssh
            state: reloaded
          when:
            - not ansible_check_mode
            - baseline_ssh_install is changed

        - name: Prove key login with the resulting configuration
          ansible.builtin.include_tasks: ssh_probe.yml
          when: not ansible_check_mode

      rescue:
        - name: Restore the previous baseline drop-in
          ansible.builtin.copy:
            src: "{{ baseline_ssh_install.backup_file }}"
            remote_src: true
            dest: /etc/ssh/sshd_config.d/10-baseline.conf
            owner: root
            group: root
            mode: "0644"
          when:
            - not ansible_check_mode
            - baseline_ssh_install.backup_file is defined

        - name: Remove a newly created baseline drop-in after failure
          ansible.builtin.file:
            path: /etc/ssh/sshd_config.d/10-baseline.conf
            state: absent
          when:
            - not ansible_check_mode
            - baseline_ssh_install is changed
            - baseline_ssh_install.backup_file is not defined

        - name: Validate the restored configuration
          ansible.builtin.command: /usr/sbin/sshd -t
          changed_when: false
          when: not ansible_check_mode

        - name: Reload the restored configuration
          ansible.builtin.service:
            name: ssh
            state: reloaded
          when: not ansible_check_mode

        - name: Report the failed SSH update
          ansible.builtin.fail:
            msg: SSH verification failed. The rollback tasks restored the previous drop-in.

  always:
    - name: Remove SSH validation files
      ansible.builtin.file:
        path: "{{ baseline_ssh_stage.path }}"
        state: absent
      check_mode: false
      changed_when: false
