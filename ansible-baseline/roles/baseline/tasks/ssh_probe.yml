---
- name: Check an independent public-key SSH login from the controller
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/check_ssh_login.py"
      - "--host={{ baseline_ssh_target.host }}"
      - "--user={{ baseline_ssh_target.user }}"
      - "--port={{ baseline_ssh_target.port }}"
      - "--key={{ baseline_ssh_target.key }}"
      - "--common-args={{ baseline_ssh_target.common_args }}"
      - "--extra-args={{ baseline_ssh_target.extra_args }}"
      - "--executable={{ baseline_ssh_target.executable }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  tags: [ssh]
